name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VP_GIT_HOOKS: "0"

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      - run: vp check
      - run: vp test
